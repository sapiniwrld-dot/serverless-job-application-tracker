AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless job application tracker

Globals:
  Function:
    Runtime: python3.14
    Timeout: 10
    MemorySize: 128

Resources:
  JobTrackerUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UserPoolTier: LITE
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
  JobTrackerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-web-client"
      UserPoolId: !Ref JobTrackerUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - "http://localhost:8080"
      LogoutURLs:
        - "http://localhost:8080"
  JobTrackerUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "job-tracker-${AWS::AccountId}-${AWS::Region}"
      UserPoolId: !Ref JobTrackerUserPool
      ManagedLoginVersion: 1
  ApplicationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: applicationId
          AttributeType: S
      KeySchema:
        - AttributeName: applicationId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  JobTrackerApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${JobTrackerUserPool}"
              audience:
                - !Ref JobTrackerUserPoolClient
        DefaultAuthorizer: CognitoAuthorizer
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2
        ThrottlingRateLimit: 1
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "authorization"
          - "content-type"
        AllowMethods:
          - "DELETE"
          - "GET"
          - "POST"
          - "PUT"

  JobTrackerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ApplicationsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ApplicationsTable
      Events:
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        ListApplications:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /applications
            Method: GET
        CreateApplication:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /applications
            Method: POST
        UpdateApplication:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /applications/{id}
            Method: PUT
        DeleteApplication:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /applications/{id}
            Method: DELETE

Outputs:
  UserPoolId:
    Description: Cognito user pool ID
    Value: !Ref JobTrackerUserPool

  UserPoolClientId:
    Description: Cognito web client ID
    Value: !Ref JobTrackerUserPoolClient

  CognitoDomain:
    Description: Cognito hosted login domain
    Value: !Sub "https://${JobTrackerUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  ApiUrl:
    Description: URL for the Job Tracker API
    Value: !Sub "https://${JobTrackerApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
