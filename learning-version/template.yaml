AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless job application tracker

Globals:
  Function:
    Runtime: python3.14
    Timeout: 10
    MemorySize: 128

Resources:
  ApplicationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: applicationId
          AttributeType: S
      KeySchema:
        - AttributeName: applicationId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  JobTrackerApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2
        ThrottlingRateLimit: 1
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "content-type"
        AllowMethods:
          - "DELETE"
          - "GET"
          - "POST"

  JobTrackerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ApplicationsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ApplicationsTable
      Events:
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /health
            Method: GET
        ListApplications:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /applications
            Method: GET
        CreateApplication:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /applications
            Method: POST
        DeleteApplication:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobTrackerApi
            Path: /applications/{id}
            Method: DELETE

Outputs:
  ApiUrl:
    Description: URL for the Job Tracker API
    Value: !Sub "https://${JobTrackerApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"

